<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia del Espíritu - Gestión de Estudiantes</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--background);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .table-container {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: var(--secondary);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.875rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }

            table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Academia del Espíritu</h1>
            <p>Gestión de Estudiantes</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Estudiantes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newStudentsMonth">0</div>
                <div class="stat-label">Nuevos este Mes</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openModal()">
                <span>+</span> Nuevo Estudiante
            </button>
            <button class="btn btn-secondary" onclick="exportToCSV()">
                <span>📥</span> Exportar CSV
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Fecha Ingreso</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="6" class="loading">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Nuevo Estudiante</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" required>
                </div>
                <div class="form-group">
                    <label for="fecha_ingreso">Fecha de Ingreso</label>
                    <input type="date" id="fecha_ingreso" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAG1apqQS-dkCCTob3lmv0BGjph3vb-EkE",
            authDomain: "academia-del-espiritu.firebaseapp.com",
            projectId: "academia-del-espiritu",
            storageBucket: "academia-del-espiritu.firebasestorage.app",
            messagingSenderId: "1010285474661",
            appId: "1:1010285474661:web:2ff92a4091d631b54be78c"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentsCollection = collection(db, "estudiantes");

        let studentsData = [];

        // Escuchar cambios en tiempo real
        onSnapshot(studentsCollection, (snapshot) => {
            studentsData = [];
            snapshot.forEach((doc) => {
                studentsData.push({
                    id: doc.id,
                    ...doc.data()
                });
            });
            renderTable();
            updateStats();
        });

        // Renderizar tabla
        function renderTable() {
            const tbody = document.getElementById('studentsTableBody');
            if (studentsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No hay estudiantes registrados</td></tr>';
                return;
            }

            tbody.innerHTML = studentsData.map(student => {
                const fecha = new Date(student.fecha_ingreso);
                // Ajuste de zona horaria para mostrar la fecha correcta
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES');

                return `
                    <tr>
                        <td>${student.nombre}</td>
                        <td>${student.apellido}</td>
                        <td>${student.email}</td>
                        <td>${student.telefono}</td>
                        <td>${fechaStr}</td>
                        <td class="actions">
                            <button class="btn btn-sm btn-secondary edit-btn" data-id="${student.id}">Editar</button>
                            <button class="btn btn-sm btn-danger delete-btn" data-id="${student.id}">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Re-asignar eventos a los nuevos botones
            assignButtonEvents();
        }

        // Actualizar estadísticas
        function updateStats() {
            document.getElementById('totalStudents').textContent = studentsData.length;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const newThisMonth = studentsData.filter(s => {
                const date = new Date(s.fecha_ingreso);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;
            
            document.getElementById('newStudentsMonth').textContent = newThisMonth;
        }

        // Asignar eventos a botones dinámicos
        function assignButtonEvents() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('button');
                    const studentId = button.getAttribute('data-id');
                    openEditModal(studentId);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('button');
                    const studentId = button.getAttribute('data-id');
                    confirmDeleteStudent(studentId);
                });
            });
        }

        // Abrir modal para editar
        async function openEditModal(id) {
            const student = studentsData.find(s => s.id === id);
            if (!student) {
                alert('Estudiante no encontrado');
                return;
            }

            document.getElementById('modalTitle').textContent = 'Editar Estudiante';
            document.getElementById('studentId').value = student.id;
            document.getElementById('nombre').value = student.nombre;
            document.getElementById('apellido').value = student.apellido;
            document.getElementById('email').value = student.email;
            document.getElementById('telefono').value = student.telefono;
            
            // Formatear fecha para input date
            const fecha = new Date(student.fecha_ingreso);
            const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
            const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
            document.getElementById('fecha_ingreso').value = adjustedDate.toISOString().split('T')[0];

            document.getElementById('studentModal').classList.add('active');
        }

        // Confirmar eliminación
        async function confirmDeleteStudent(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este estudiante?')) {
                try {
                    await deleteDoc(doc(db, "estudiantes", id));
                    // La actualización es automática gracias a onSnapshot
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert('Error al eliminar el estudiante');
                }
            }
        }

        // Manejar envío del formulario
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('studentId').value;
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const fechaInput = document.getElementById('fecha_ingreso').value;

            // Convertir fecha a timestamp UTC
            const [year, month, day] = fechaInput.split('-').map(Number);
            const fechaTimestamp = new Date(year, month - 1, day).getTime();

            const studentData = {
                nombre,
                apellido,
                email,
                telefono,
                fecha_ingreso: fechaTimestamp
            };

            try {
                if (id) {
                    // Actualizar existente
                    await updateDoc(doc(db, "estudiantes", id), studentData);
                } else {
                    // Crear nuevo
                    await addDoc(studentsCollection, studentData);
                }
                closeModal();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert('Error al guardar los datos');
            }
        });

        // Funciones globales para el HTML
        window.openModal = () => {
            document.getElementById('modalTitle').textContent = 'Nuevo Estudiante';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('studentModal').classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('studentModal').classList.remove('active');
        };

        // Exportar a CSV
        window.exportToCSV = () => {
            if (studentsData.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            // Encabezados
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID,Nombre,Apellido,Email,Teléfono,Fecha Ingreso\n";

            // Filas
            studentsData.forEach(student => {
                const fecha = new Date(student.fecha_ingreso);
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES');

                const row = [
                    student.id,
                    `"${student.nombre}"`,
                    `"${student.apellido}"`,
                    `"${student.email}"`,
                    `"${student.telefono}"`,
                    fechaStr
                ].join(",");
                csvContent += row + "\n";
            });

            // Crear enlace de descarga
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `estudiantes_academia_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Cerrar modal al hacer clic fuera
        document.getElementById('studentModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('studentModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
