<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia del Espíritu Santo</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f6fa;
            --text-color: #2c3e50;
            --border-color: #dcdde1;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f1c40f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .status-active {
            color: var(--success-color);
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            table {
                font-size: 14px;
            }
            
            th, td {
                padding: 10px 5px;
            }
            
            .actions-bar {
                flex-direction: column;
            }
            
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Academia del Espíritu Santo</h1>
            <div id="connection-status" style="font-size: 0.9em; color: #7f8c8d;">Conectando...</div>
        </div>
    </header>

    <div class="container">
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total Estudiantes</div>
                <div class="stat-number" id="total-students">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Activos</div>
                <div class="stat-number" id="active-students">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Nuevos este Mes</div>
                <div class="stat-number" id="new-students">0</div>
            </div>
        </div>

        <div class="actions-bar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar por nombre, email o teléfono...">
            </div>
            <button class="btn btn-primary" id="new-student-btn">
                <span>+</span> Nuevo Estudiante
            </button>
        </div>

        <div id="students-table-container">
            <div class="loading">Cargando estudiantes...</div>
        </div>
    </div>

    <!-- Modal para Nuevo/Editar Estudiante -->
    <div class="modal" id="student-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Estudiante</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="student-form">
                <input type="hidden" id="student-id">
                <div class="form-group">
                    <label for="name">Nombre Completo *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono *</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="course">Curso *</label>
                    <input type="text" id="course" required>
                </div>
                <div class="form-group">
                    <label for="status">Estado</label>
                    <select id="status">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Graduado">Graduado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entry-date">Fecha de Ingreso *</label>
                    <input type="date" id="entry-date" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmación de Eliminación -->
    <div class="modal" id="delete-modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>Confirmar Eliminación</h2>
                <button class="close-modal" id="close-delete-modal">&times;</button>
            </div>
            <p>¿Estás seguro de que deseas eliminar a este estudiante? Esta acción no se puede deshacer.</p>
            <div class="form-actions">
                <button class="btn btn-secondary" id="cancel-delete-btn">Cancelar</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Eliminar</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAG1apqQS-dkCCTob3lmv0BGjph3vb-EkE",
            authDomain: "academia-del-espiritu.firebaseapp.com",
            projectId: "academia-del-espiritu",
            storageBucket: "academia-del-espiritu.firebasestorage.app",
            messagingSenderId: "1010285474661",
            appId: "1:1010285474661:web:2ff92a4091d631b54be78c"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentsCollection = collection(db, "estudiantes");

        // Elementos del DOM
        const studentsTableContainer = document.getElementById('students-table-container');
        const studentModal = document.getElementById('student-modal');
        const deleteModal = document.getElementById('delete-modal');
        const studentForm = document.getElementById('student-form');
        const newStudentBtn = document.getElementById('new-student-btn');
        const closeModalBtn = document.getElementById('close-modal');
        const closeDeleteModalBtn = document.getElementById('close-delete-modal');
        const cancelBtn = document.getElementById('cancel-btn');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        const modalTitle = document.getElementById('modal-title');
        const searchInput = document.getElementById('search-input');
        const connectionStatus = document.getElementById('connection-status');

        // Estado de la aplicación
        let allStudents = [];
        let studentToDelete = null;

        // Escuchar cambios en tiempo real
        const q = query(studentsCollection, orderBy("entryDate", "desc"));
        
        onSnapshot(q, (snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                allStudents.push({
                    id: doc.id, // ID real de Firestore
                    ...doc.data()
                });
            });
            renderStudents(allStudents);
            updateStats();
            connectionStatus.textContent = "● Conectado en tiempo real";
            connectionStatus.style.color = "#2ecc71";
        }, (error) => {
            console.error("Error al escuchar cambios: ", error);
            connectionStatus.textContent = "⚠ Error de conexión";
            connectionStatus.style.color = "#e74c3c";
            studentsTableContainer.innerHTML = `<div class="empty-state">Error al cargar datos: ${error.message}</div>`;
        });

        // Renderizar tabla
        function renderStudents(students) {
            if (students.length === 0) {
                studentsTableContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>No hay estudiantes registrados</h3>
                        <p>Haz clic en "Nuevo Estudiante" para comenzar</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Curso</th>
                            <th>Estado</th>
                            <th>Fecha Ingreso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            students.forEach(student => {
                const dateObj = new Date(student.entryDate);
                // Ajuste de zona horaria simple para visualización
                const userTimezoneOffset = dateObj.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(dateObj.getTime() + userTimezoneOffset);
                const formattedDate = adjustedDate.toLocaleDateString('es-ES');

                html += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.phone}</td>
                        <td>${student.course}</td>
                        <td><span class="status-${student.status.toLowerCase()}">${student.status}</span></td>
                        <td>${formattedDate}</td>
                        <td>
                            <button class="professional-button edit-btn" data-id="${student.id}">Editar</button>
                            <button class="professional-button delete-btn" data-id="${student.id}">Eliminar</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            studentsTableContainer.innerHTML = html;
        }

        // Actualizar estadísticas
        function updateStats() {
            const total = allStudents.length;
            const active = allStudents.filter(s => s.status === 'Activo').length;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const newThisMonth = allStudents.filter(s => {
                const date = new Date(s.entryDate);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;

            document.getElementById('total-students').textContent = total;
            document.getElementById('active-students').textContent = active;
            document.getElementById('new-students').textContent = newThisMonth;
        }

        // Abrir modal para nuevo estudiante
        newStudentBtn.addEventListener('click', () => {
            modalTitle.textContent = 'Nuevo Estudiante';
            studentForm.reset();
            document.getElementById('student-id').value = '';
            // Establecer fecha de hoy por defecto
            document.getElementById('entry-date').valueAsDate = new Date();
            studentModal.style.display = 'flex';
        });

        // Cerrar modal
        closeModalBtn.addEventListener('click', () => {
            studentModal.style.display = 'none';
        });

        closeDeleteModalBtn.addEventListener('click', () => {
            deleteModal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            studentModal.style.display = 'none';
        });

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.style.display = 'none';
        });

        // Cerrar modal al hacer clic fuera
        window.addEventListener('click', (e) => {
            if (e.target === studentModal) {
                studentModal.style.display = 'none';
            }
            if (e.target === deleteModal) {
                deleteModal.style.display = 'none';
            }
        });

        // Manejar envío del formulario (Crear o Actualizar)
        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const studentId = document.getElementById('student-id').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const course = document.getElementById('course').value;
            const status = document.getElementById('status').value;
            const entryDateVal = document.getElementById('entry-date').value;

            // Convertir fecha a timestamp UTC
            const [year, month, day] = entryDateVal.split('-').map(Number);
            const entryDate = new Date(year, month - 1, day).getTime();

            const studentData = {
                name,
                email,
                phone,
                course,
                status,
                entryDate
            };

            try {
                if (studentId) {
                    // Actualizar existente
                    const studentRef = doc(db, "estudiantes", studentId);
                    await updateDoc(studentRef, studentData);
                    alert('Estudiante actualizado correctamente');
                } else {
                    // Crear nuevo
                    await addDoc(studentsCollection, studentData);
                    alert('Estudiante registrado correctamente');
                }
                studentModal.style.display = 'none';
                studentForm.reset();
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert('Error al guardar el estudiante: ' + error.message);
            }
        });

        // Delegación de eventos para Editar y Eliminar
        studentsTableContainer.addEventListener('click', async (e) => {
            // Usar closest para asegurar que obtenemos el botón aunque se haga clic en el texto
            const editBtn = e.target.closest('.edit-btn');
            const deleteBtn = e.target.closest('.delete-btn');

            if (editBtn) {
                const studentId = editBtn.getAttribute('data-id');
                if (!studentId) return;
                
                try {
                    // Obtener datos frescos de Firestore (aunque ya los tenemos en allStudents, es más seguro)
                    // Usamos los datos en memoria para ser más rápidos, ya que onSnapshot los mantiene actualizados
                    const student = allStudents.find(s => s.id === studentId);
                    if (student) {
                        openEditModal(student);
                    } else {
                        alert('Estudiante no encontrado');
                    }
                } catch (error) {
                    console.error("Error al cargar datos:", error);
                    alert('Error al cargar los datos del estudiante');
                }
            } else if (deleteBtn) {
                const studentId = deleteBtn.getAttribute('data-id');
                if (!studentId) return;
                
                const student = allStudents.find(s => s.id === studentId);
                if (student) {
                    openDeleteModal(studentId, student.name);
                }
            }
        });

        function openEditModal(student) {
            modalTitle.textContent = 'Editar Estudiante';
            document.getElementById('student-id').value = student.id;
            document.getElementById('name').value = student.name;
            document.getElementById('email').value = student.email;
            document.getElementById('phone').value = student.phone;
            document.getElementById('course').value = student.course;
            document.getElementById('status').value = student.status;
            
            // Formatear fecha para el input date (YYYY-MM-DD)
            const dateObj = new Date(student.entryDate);
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            document.getElementById('entry-date').value = `${year}-${month}-${day}`;
            
            studentModal.style.display = 'flex';
        }

        function openDeleteModal(id, name) {
            studentToDelete = id;
            document.querySelector('#delete-modal p').textContent = 
                `¿Estás seguro de que deseas eliminar a "${name}"? Esta acción no se puede deshacer.`;
            deleteModal.style.display = 'flex';
        }

        // Confirmar eliminación
        confirmDeleteBtn.addEventListener('click', async () => {
            if (!studentToDelete) return;

            try {
                await deleteDoc(doc(db, "estudiantes", studentToDelete));
                alert('Estudiante eliminado correctamente');
                deleteModal.style.display = 'none';
                studentToDelete = null;
            } catch (error) {
                console.error("Error al eliminar: ", error);
                alert('Error al eliminar el estudiante: ' + error.message);
            }
        });

        // Búsqueda
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredStudents = allStudents.filter(student => 
                student.name.toLowerCase().includes(searchTerm) ||
                student.email.toLowerCase().includes(searchTerm) ||
                student.phone.includes(searchTerm) ||
                student.course.toLowerCase().includes(searchTerm)
            );
            renderStudents(filteredStudents);
        });
    </script>
</body>
</html>
