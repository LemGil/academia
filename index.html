<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia del Espíritu - Gestión de Estudiantes</title>
    
    <!-- Tipografías Oficiales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta Oficial */
            --primary-teal: #1A3A4A;
            --sacred-gold: #C9A24A;
            --gold-highlight: #F5D77A;
            --deep-gold-shadow: #8A6A2F;
            --ivory-bg: #F5F1E8;
            --charcoal-text: #1C1C1C;
            --parchment-gray: #D6D0C4;
            
            /* Tipografía */
            --font-title: 'Cinzel', serif;
            --font-body: 'Crimson Pro', serif;
            --font-ui: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--ivory-bg);
            /* Textura sutil de papel/pergamino */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            color: var(--charcoal-text);
            font-family: var(--font-body);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Encabezado Institucional */
        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--sacred-gold);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-highlight), transparent);
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-img {
            max-height: 120px;
            width: auto;
            /* Sombra dorada sutil y borde elegante */
            filter: drop-shadow(0 4px 6px rgba(26, 58, 74, 0.2));
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.02);
        }

        h1 {
            font-family: var(--font-title);
            color: var(--primary-teal);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: var(--font-ui);
            color: var(--deep-gold-shadow);
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Tarjetas de Estadísticas */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: #fff;
            padding: 2rem;
            border-radius: 4px; /* Bordes menos redondeados para seriedad */
            border: 1px solid var(--parchment-gray);
            border-top: 4px solid var(--sacred-gold);
            box-shadow: 0 4px 12px rgba(26, 58, 74, 0.08);
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 58, 74, 0.12);
        }

        .stat-number {
            font-family: var(--font-title);
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-teal);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-family: var(--font-ui);
            color: var(--deep-gold-shadow);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Barra de Herramientas */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 2px; /* Bordes más rectos */
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: var(--primary-teal);
            color: var(--gold-highlight);
            border: 1px solid var(--primary-teal);
        }

        .btn-primary:hover {
            background-color: #132b36;
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 58, 74, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-teal);
            border: 1px solid var(--sacred-gold);
        }

        .btn-secondary:hover {
            background-color: var(--sacred-gold);
            color: #fff;
            box-shadow: 0 4px 12px rgba(201, 162, 74, 0.3);
        }

        /* Tabla Académica */
        .table-container {
            background: #fff;
            border-radius: 4px;
            border: 1px solid var(--parchment-gray);
            box-shadow: 0 4px 20px rgba(26, 58, 74, 0.06);
            overflow: hidden;
            position: relative;
        }

        /* Detalle ornamental en esquinas de la tabla */
        .table-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 20px; height: 20px;
            border-top: 2px solid var(--sacred-gold);
            border-left: 2px solid var(--sacred-gold);
        }
        .table-container::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--sacred-gold);
            border-right: 2px solid var(--sacred-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--primary-teal);
            color: var(--gold-highlight);
            font-family: var(--font-title);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1.25rem;
            font-size: 0.9rem;
            border-bottom: 3px solid var(--sacred-gold);
        }

        td {
            padding: 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--parchment-gray);
            color: var(--charcoal-text);
            font-size: 1rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(245, 215, 122, 0.1); /* Tinte dorado muy sutil al hover */
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 58, 74, 0.85); /* Fondo oscuro azulado */
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--ivory-bg);
            padding: 2.5rem;
            border-radius: 4px;
            width: 100%;
            max-width: 550px;
            border: 2px solid var(--sacred-gold);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Detalle dorado en esquinas del modal */
        .modal-content::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(201, 162, 74, 0.3);
            pointer-events: none;
        }

        .modal-content h2 {
            font-family: var(--font-title);
            color: var(--primary-teal);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            border-bottom: 1px solid var(--parchment-gray);
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: var(--font-ui);
            font-weight: 600;
            color: var(--primary-teal);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid var(--parchment-gray);
            background: #fff;
            border-radius: 2px;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--charcoal-text);
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--sacred-gold);
            box-shadow: 0 0 0 3px rgba(201, 162, 74, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--deep-gold-shadow);
            font-style: italic;
            font-family: var(--font-body);
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }

            h1 { font-size: 1.8rem; }
            
            table { font-size: 0.9rem; }
            th, td { padding: 0.75rem 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="Escudo Academia del Espíritu" class="logo-img">
            </div>
            <h1>Academia del Espíritu</h1>
            <p class="subtitle">Formación Teológica Apostólica</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Estudiantes Matriculados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newStudentsMonth">0</div>
                <div class="stat-label">Nuevos Ingresos este Mes</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openModal()">
                <span>+</span> Registrar Estudiante
            </button>
            <button class="btn btn-secondary" onclick="exportToCSV()">
                <span>📥</span> Exportar Registro (CSV)
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Epístola (Email)</th>
                        <th>Voz (Teléfono)</th>
                        <th>Fecha Ingreso</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="6" class="loading">Cargando registros sagrados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Registro de Estudiante</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" required placeholder="Ej: Pérez">
                </div>
                <div class="form-group">
                    <label for="email">Epístola (Email)</label>
                    <input type="email" id="email" required placeholder="juan@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Voz (Teléfono)</label>
                    <input type="tel" id="telefono" required placeholder="+54 9 11...">
                </div>
                <div class="form-group">
                    <label for="fecha_ingreso">Fecha de Ingreso</label>
                    <input type="date" id="fecha_ingreso" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAG1apqQS-dkCCTob3lmv0BGjph3vb-EkE",
            authDomain: "academia-del-espiritu.firebaseapp.com",
            projectId: "academia-del-espiritu",
            storageBucket: "academia-del-espiritu.firebasestorage.app",
            messagingSenderId: "1010285474661",
            appId: "1:1010285474661:web:2ff92a4091d631b54be78c"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentsCollection = collection(db, "estudiantes");

        let studentsData = [];

        // Escuchar cambios en tiempo real
        onSnapshot(studentsCollection, (snapshot) => {
            studentsData = [];
            snapshot.forEach((doc) => {
                studentsData.push({
                    id: doc.id,
                    ...doc.data()
                });
            });
            renderTable();
            updateStats();
        });

        // Renderizar tabla
        function renderTable() {
            const tbody = document.getElementById('studentsTableBody');
            if (studentsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No hay registros en el libro</td></tr>';
                return;
            }

            tbody.innerHTML = studentsData.map(student => {
                const fecha = new Date(student.fecha_ingreso);
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

                return `
                    <tr>
                        <td style="font-weight:600">${student.nombre}</td>
                        <td>${student.apellido}</td>
                        <td style="font-family:var(--font-ui); font-size:0.9em">${student.email}</td>
                        <td style="font-family:var(--font-ui); font-size:0.9em">${student.telefono}</td>
                        <td>${fechaStr}</td>
                        <td class="actions">
                            <button class="btn btn-sm btn-secondary edit-btn" data-id="${student.id}">Editar</button>
                            <button class="btn btn-sm" style="background:transparent; color:#ef4444; border:1px solid #ef4444" data-id="${student.id}" onclick="confirmDeleteStudent('${student.id}')">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            assignButtonEvents();
        }

        // Actualizar estadísticas
        function updateStats() {
            document.getElementById('totalStudents').textContent = studentsData.length;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const newThisMonth = studentsData.filter(s => {
                const date = new Date(s.fecha_ingreso);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;
            
            document.getElementById('newStudentsMonth').textContent = newThisMonth;
        }

        // Asignar eventos a botones dinámicos
        function assignButtonEvents() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('button');
                    const studentId = button.getAttribute('data-id');
                    openEditModal(studentId);
                });
            });
        }

        // Abrir modal para editar
        async function openEditModal(id) {
            const student = studentsData.find(s => s.id === id);
            if (!student) {
                alert('Registro no encontrado');
                return;
            }

            document.getElementById('modalTitle').textContent = 'Editar Registro';
            document.getElementById('studentId').value = student.id;
            document.getElementById('nombre').value = student.nombre;
            document.getElementById('apellido').value = student.apellido;
            document.getElementById('email').value = student.email;
            document.getElementById('telefono').value = student.telefono;
            
            const fecha = new Date(student.fecha_ingreso);
            const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
            const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
            document.getElementById('fecha_ingreso').value = adjustedDate.toISOString().split('T')[0];

            document.getElementById('studentModal').classList.add('active');
        }

        // Confirmar eliminación (Global)
        window.confirmDeleteStudent = async (id) => {
            if (confirm('¿Estás seguro de que deseas eliminar este registro del libro? Esta acción no se puede deshacer.')) {
                try {
                    await deleteDoc(doc(db, "estudiantes", id));
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert('Error al eliminar el registro');
                }
            }
        };

        // Manejar envío del formulario
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('studentId').value;
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const fechaInput = document.getElementById('fecha_ingreso').value;

            const [year, month, day] = fechaInput.split('-').map(Number);
            const fechaTimestamp = new Date(year, month - 1, day).getTime();

            const studentData = {
                nombre,
                apellido,
                email,
                telefono,
                fecha_ingreso: fechaTimestamp
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "estudiantes", id), studentData);
                } else {
                    await addDoc(studentsCollection, studentData);
                }
                closeModal();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert('Error al guardar los datos');
            }
        });

        // Funciones globales
        window.openModal = () => {
            document.getElementById('modalTitle').textContent = 'Nuevo Registro';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('studentModal').classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('studentModal').classList.remove('active');
        };

        // Exportar a CSV
        window.exportToCSV = () => {
            if (studentsData.length === 0) {
                alert('No hay registros para exportar');
                return;
            }

            let csvContent = "text/csv;charset=utf-8,";
            csvContent += "ID,Nombre,Apellido,Email,Teléfono,Fecha Ingreso\n";

            studentsData.forEach(student => {
                const fecha = new Date(student.fecha_ingreso);
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES');

                const row = [
                    student.id,
                    `"${student.nombre}"`,
                    `"${student.apellido}"`,
                    `"${student.email}"`,
                    `"${student.telefono}"`,
                    fechaStr
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `registro_academia_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Cerrar modal al hacer clic fuera
        document.getElementById('studentModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('studentModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
