<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia del Espíritu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="data:text/css;base64,/* Aquí irían los estilos */">
    <style>
        /* Estilos (los mismos de antes, omitidos por brevedad) */
        :root {
            --nivel1: #3D1C4D; --nivel2: #1A3A4A; --nivel3: #4A5A3D;
            --gold: #C9A24A; --gold-light: #F5D77A;
            --bg: #F5F1E8; --surface: #FFFFFF; --border: #D6D0C4;
            --text: #1C1C1C; --success: #27ae60; --danger: #c0392b;
            --radius: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg); }
        .hidden { display:none !important; }
        .skeleton { background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:4px; }
        @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .spinner { width:40px; height:40px; border:4px solid #ddd; border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:2rem auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .toast { position:fixed; bottom:2rem; right:2rem; padding:1rem 2rem; border-radius:8px; color:#fff; z-index:9999; animation:slideIn 0.3s; }
        .toast-success { background:var(--success); }
        .toast-error { background:var(--danger); }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header id="app-header"></header>
    
    <!-- Navegación de niveles -->
    <nav id="nav-niveles"></nav>
    
    <!-- Contenido principal -->
    <main id="main-content">
        <div class="spinner"></div>
    </main>
</div>

<!-- Modales -->
<div id="modal-overlay" class="hidden" onclick="App.Modal.close()">
    <div id="modal-container"></div>
</div>

<!-- Login -->
<div id="login-overlay" class="hidden">
    <div class="login-box">
        <h2>Acceso Admin</h2>
        <input type="password" id="login-password" placeholder="Contraseña">
        <div class="login-actions">
            <button onclick="App.Auth.hideLogin()">Cancelar</button>
            <button onclick="App.Auth.login()">Entrar</button>
        </div>
        <p id="login-error" class="hidden">Contraseña incorrecta</p>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ============================================================
// MÓDULO: Configuración
// ============================================================
const CONFIG = {
    SUPABASE_URL: "https://cdabgazsrjkfcqzqeint.supabase.co",
    SUPABASE_KEY: "sb_publishable_gbS0u_HxiWdEuCANkRbGeQ_gKChZZiN",
    ADMIN_PASS: "academia2025" // Temporal - mover a Supabase Auth
};

// ============================================================
// MÓDULO: API Client
// ============================================================
const API = {
    headers: {
        "Content-Type": "application/json",
        "apikey": CONFIG.SUPABASE_KEY,
        "Authorization": "Bearer " + CONFIG.SUPABASE_KEY
    },
    
    async request(path, method = "GET", body = null, prefer = null) {
        const headers = {...this.headers};
        if (prefer) headers["Prefer"] = prefer;
        
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        
        const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, opts);
        
        if (res.status === 204) return null;
        if (res.status === 200 && method === "DELETE") return null;
        if (res.ok) {
            const text = await res.text();
            return text ? JSON.parse(text) : null;
        }
        throw new Error(await res.text());
    },
    
    // Métodos CRUD genéricos
    async getAll(table, query = "*", order = null) {
        let path = `${table}?select=${query}`;
        if (order) path += `&order=${order}`;
        return (await this.request(path)) || [];
    },
    
    async getById(table, id, query = "*") {
        const result = await this.request(`${table}?id=eq.${id}&select=${query}`);
        return result?.[0] || null;
    },
    
    async create(table, data) {
        return await this.request(table, "POST", data, "return=representation");
    },
    
    async update(table, id, data) {
        return await this.request(`${table}?id=eq.${id}`, "PATCH", data, "return=minimal");
    },
    
    async remove(table, id) {
        return await this.request(`${table}?id=eq.${id}`, "DELETE");
    }
};

// ============================================================
// MÓDULO: Store (Estado centralizado)
// ============================================================
const Store = {
    state: {
        isAdmin: false,
        estudianteActual: null,
        nivelActual: null,
        cursoActual: null,
        temaActual: null,
        // Datos cacheados
        niveles: [],
        cursos: [],
        temas: [],
        pasos: [],
        progreso: [],
        estudiantes: [],
        // UI
        isLoading: false,
        fontSize: 1.1,
        modoOscuro: false
    },
    
    // Getters
    get cursosNivel() {
        return this.state.cursos
            .filter(c => c.nivel_id === this.state.nivelActual?.id)
            .sort((a, b) => (a.orden || 0) - (b.orden || 0));
    },
    
    get temasCurso() {
        return this.state.temas
            .filter(t => t.curso_id === this.state.cursoActual?.id)
            .sort((a, b) => (a.orden || 0) - (b.orden || 0));
    },
    
    get pasosTema() {
        return this.state.pasos
            .filter(p => p.tema_id === this.state.temaActual?.id)
            .sort((a, b) => (a.orden || 0) - (b.orden || 0));
    },
    
    // Acciones
    setState(key, value) {
        this.state[key] = value;
    },
    
    async loadData(table) {
        const map = {
            niveles: () => API.getAll("niveles", "*", "orden"),
            cursos: () => API.getAll("cursos", "*", "orden"),
            temas: () => API.getAll("temas", "*", "orden"),
            pasos: () => API.getAll("pasos", "*", "orden"),
            estudiantes: () => API.getAll("estudiantes", "*", "nombre"),
            progreso: async () => {
                if (!this.state.estudianteActual) return [];
                return await API.getAll("progreso", "*", `estudiante_id=eq.${this.state.estudianteActual.id}`);
            }
        };
        
        if (map[table]) {
            this.state[table] = await map[table]();
        }
    }
};

// ============================================================
// MÓDULO: UI Helpers
// ============================================================
const UI = {
    // Templates
    templates: {
        emptyState(msg) {
            return `<div class="empty-state">${msg}</div>`;
        },
        
        skeleton(count = 3) {
            return Array(count).fill('<div class="skeleton" style="height:100px;margin-bottom:1rem"></div>').join('');
        },
        
        spinner() {
            return '<div class="spinner"></div>';
        },
        
        progresoBar(pct, color) {
            return `<div class="progreso-bar"><div class="progreso-fill" style="width:${pct}%;background:${color}"></div></div>`;
        }
    },
    
    // Toast notifications
    toast(msg, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    },
    
    // Event Delegation
    delegate(event, selector, handler) {
        return function(e) {
            const target = e.target.closest(selector);
            if (target) handler.call(target, e, target);
        };
    },
    
    // Debounce
    debounce(fn, delay = 300) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => fn.apply(this, args), delay);
        };
    }
};

// ============================================================
// MÓDULO: Auth
// ============================================================
const Auth = {
    showLogin() {
        document.getElementById("login-overlay").classList.remove("hidden");
        document.getElementById("login-password").focus();
    },
    
    hideLogin() {
        document.getElementById("login-overlay").classList.add("hidden");
        document.getElementById("login-password").value = "";
    },
    
    async login() {
        const password = document.getElementById("login-password").value;
        
        if (password === CONFIG.ADMIN_PASS) {
            Store.setState("isAdmin", true);
            this.hideLogin();
            UI.toast("✅ Acceso concedido");
            App.render();
        } else {
            document.getElementById("login-error").classList.remove("hidden");
        }
    },
    
    logout() {
        Store.setState("isAdmin", false);
        App.render();
    }
};

// ============================================================
// MÓDULO: Modal
// ============================================================
const Modal = {
    open(content) {
        document.getElementById("modal-container").innerHTML = content;
        document.getElementById("modal-overlay").classList.remove("hidden");
    },
    
    close() {
        document.getElementById("modal-overlay").classList.add("hidden");
    },
    
    // Templates de modales
    cursoForm(curso = null) {
        const isEdit = !!curso;
        return `
            <div class="modal-content" onclick="event.stopPropagation()">
                <h2>${isEdit ? 'Editar' : 'Nuevo'} Curso</h2>
                <form id="curso-form">
                    <input type="hidden" name="id" value="${curso?.id || ''}">
                    <div class="form-group">
                        <label>Nivel</label>
                        <select name="nivel_id" required>
                            ${Store.state.niveles.map(n => `
                                <option value="${n.id}" ${Store.state.nivelActual?.id === n.id ? 'selected' : ''}>${n.nombre}</option>
                            `).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" name="titulo" required value="${curso?.titulo || ''}">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" name="descripcion" value="${curso?.descripcion || ''}">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="Modal.close()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        `;
    }
};

// ============================================================
// MÓDULO: App (Controlador principal)
// ============================================================
const App = {
    async init() {
        // Cargar datos iniciales
        await Store.loadData("niveles");
        await Store.loadData("cursos");
        await Store.loadData("temas");
        await Store.loadData("pasos");
        await Store.loadData("estudiantes");
        
        // Seleccionar primer nivel
        if (Store.state.niveles.length > 0) {
            Store.setState("nivelActual", Store.state.niveles[0]);
        }
        
        // Seleccionar primer estudiante
        if (Store.state.estudiantes.length > 0) {
            Store.setState("estudianteActual", Store.state.estudiantes[0]);
            await Store.loadData("progreso");
        }
        
        this.render();
        this.setupEventDelegation();
    },
    
    render() {
        this.renderHeader();
        this.renderNivelesNav();
        this.renderMainContent();
    },
    
    renderHeader() {
        document.getElementById("app-header").innerHTML = `
            <img src="logo.png" alt="Logo" class="logo">
            <div class="header-text">
                <h1>Academia del Espíritu</h1>
                <p>Formación Teológica Apostólica</p>
            </div>
            <div class="header-actions">
                ${Store.state.isAdmin ? '<span class="admin-badge">Admin</span>' : ''}
                ${Store.state.isAdmin 
                    ? '<button class="btn btn-sm btn-danger" onclick="Auth.logout()">Salir</button>'
                    : '<button class="btn btn-sm btn-secondary" onclick="Auth.showLogin()">Acceso Admin</button>'}
            </div>
        `;
    },
    
    renderNivelesNav() {
        document.getElementById("nav-niveles").innerHTML = Store.state.niveles.map(n => `
            <button class="nivel-tab nivel-${n.orden} ${Store.state.nivelActual?.id === n.id ? 'active' : ''}"
                    onclick="App.selectNivel(${n.id})">
                <span class="nivel-numero" style="color:${n.color}">${n.nombre}</span>
                <span class="nivel-nombre">${n.descripcion || ''}</span>
            </button>
        `).join('');
    },
    
    renderMainContent() {
        const main = document.getElementById("main-content");
        
        if (!Store.state.nivelActual) {
            main.innerHTML = UI.templates.emptyState("🎓 Bienvenido a la Academia del Espíritu");
            return;
        }
        
        if (!Store.state.cursosNivel.length) {
            main.innerHTML = UI.templates.emptyState("No hay cursos en este nivel aún.");
            return;
        }
        
        main.innerHTML = `
            <h2>📚 Cursos de ${Store.state.nivelActual.nombre}</h2>
            <div class="cursos-grid">
                ${Store.state.cursosNivel.map(curso => this.cursoCard(curso)).join('')}
            </div>
        `;
    },
    
    cursoCard(curso) {
        const temasCurso = Store.state.temas.filter(t => t.curso_id === curso.id);
        const color = Store.state.nivelActual.color;
        
        return `
            <div class="curso-card">
                <div class="curso-card-header" style="background:${color}">
                    <span>${temasCurso.length} temas</span>
                </div>
                <div class="curso-card-body">
                    <div class="curso-titulo">${curso.titulo}</div>
                    <div class="curso-desc">${curso.descripcion || ''}</div>
                    <button class="btn btn-primary btn-sm" onclick="App.verCurso(${curso.id})">📖 Ver Temas</button>
                </div>
            </div>
        `;
    },
    
    async selectNivel(id) {
        Store.setState("nivelActual", Store.state.niveles.find(n => n.id === id));
        Store.setState("cursoActual", null);
        Store.setState("temaActual", null);
        await Store.loadData("cursos");
        this.render();
    },
    
    async verCurso(id) {
        Store.setState("cursoActual", Store.state.cursos.find(c => c.id === id));
        Store.setState("temaActual", null);
        await Store.loadData("temas");
        await Store.loadData("pasos");
        this.render();
    },
    
    setupEventDelegation() {
        // Usar event delegation para formularios y clicks dinámicos
        document.addEventListener("submit", UI.delegate("form", async (e, form) => {
            e.preventDefault();
            // Lógica de guardado según el tipo de formulario
        }));
    }
};

// ============================================================
// INICIAR APLICACIÓN
// ============================================================
document.addEventListener("DOMContentLoaded", () => App.init());
</script>
</body>
</html>
