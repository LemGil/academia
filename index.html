<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia del Espíritu | Formación Teológica</title>
    
    <!-- Tipografías Oficiales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta Oficial */
            --primary-teal: #1A3A4A;
            --sacred-gold: #C9A24A;
            --gold-highlight: #F5D77A;
            --deep-gold-shadow: #8A6A2F;
            --ivory-bg: #F5F1E8;
            --charcoal-text: #1C1C1C;
            --parchment-gray: #D6D0C4;
            
            /* Tipografía */
            --font-title: 'Cinzel', serif;
            --font-body: 'Crimson Pro', serif;
            --font-ui: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--ivory-bg);
            color: var(--charcoal-text);
            font-family: var(--font-body);
            line-height: 1.7;
            background-image: 
                linear-gradient(rgba(245, 241, 232, 0.9), rgba(245, 241, 232, 0.9)),
                url("image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A24A' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header Solemne */
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--sacred-gold);
            position: relative;
        }

        header::after {
            content: '✝';
            display: block;
            font-size: 1.5rem;
            color: var(--sacred-gold);
            margin-top: 1rem;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-title);
            color: var(--primary-teal);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 2px rgba(26, 58, 74, 0.1);
        }

        .subtitle {
            font-family: var(--font-ui);
            color: var(--deep-gold-shadow);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
        }

        /* Tarjetas de Estadísticas */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: #fff;
            padding: 2rem;
            border-radius: 4px;
            border: 1px solid var(--parchment-gray);
            text-align: center;
            position: relative;
            box-shadow: 0 4px 12px rgba(26, 58, 74, 0.05);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--sacred-gold);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--sacred-gold);
        }

        .stat-number {
            font-family: var(--font-title);
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-teal);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-family: var(--font-ui);
            color: var(--deep-gold-shadow);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Barra de Herramientas */
        .toolbar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.9rem 2rem;
            border: none;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            text-transform: uppercase;
            border-radius: 2px;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: var(--primary-teal);
            color: var(--gold-highlight);
            border: 1px solid var(--primary-teal);
        }

        .btn-primary:hover {
            background-color: var(--deep-gold-shadow);
            border-color: var(--deep-gold-shadow);
            color: #fff;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-teal);
            border: 1px solid var(--primary-teal);
        }

        .btn-secondary:hover {
            background-color: var(--primary-teal);
            color: var(--ivory-bg);
        }

        /* Tabla Académica */
        .table-container {
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(26, 58, 74, 0.08);
            overflow: hidden;
            border: 1px solid var(--parchment-gray);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--primary-teal);
            color: var(--gold-highlight);
            font-family: var(--font-title);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            padding: 1.25rem 1rem;
            text-align: left;
            border-bottom: 3px solid var(--sacred-gold);
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--parchment-gray);
            color: var(--charcoal-text);
            font-size: 1rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(245, 241, 232, 0.6);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-danger {
            background-color: transparent;
            color: #8B3A3A; /* Rojo teológico suave */
            border: 1px solid #8B3A3A;
        }

        .btn-danger:hover {
            background-color: #8B3A3A;
            color: #fff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 58, 74, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--ivory-bg);
            padding: 3rem;
            border-radius: 4px;
            width: 100%;
            max-width: 550px;
            border: 2px solid var(--sacred-gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(201, 162, 74, 0.3);
            pointer-events: none;
        }

        h2 {
            font-family: var(--font-title);
            color: var(--primary-teal);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: var(--font-ui);
            font-weight: 500;
            color: var(--primary-teal);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid var(--parchment-gray);
            background: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--charcoal-text);
            border-radius: 2px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--sacred-gold);
            box-shadow: 0 0 0 2px rgba(201, 162, 74, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2.5rem;
            border-top: 1px solid var(--parchment-gray);
            padding-top: 1.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--deep-gold-shadow);
            font-style: italic;
            font-family: var(--font-body);
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .stats-container { gap: 1rem; }
            .toolbar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            table { font-size: 0.9rem; }
            th, td { padding: 0.75rem 0.5rem; }
            .modal-content { padding: 1.5rem; margin: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Academia del Espíritu</h1>
            <p class="subtitle">Gestión de Estudiantes & Formación Apostólica</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Estudiantes Matriculados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="newStudentsMonth">0</div>
                <div class="stat-label">Nuevos Ingresos este Mes</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openModal()">
                <span>+</span> Nuevo Estudiante
            </button>
            <button class="btn btn-secondary" onclick="exportToCSV()">
                <span>📥</span> Exportar Registro
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Epístola (Email)</th>
                        <th>Voz (Teléfono)</th>
                        <th>Fecha Ingreso</th>
                        <th>Administración</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="6" class="loading">Cargando registros sagrados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Registro de Estudiante</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label for="nombre">Nombre de Pila</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido Paterno</label>
                    <input type="text" id="apellido" required placeholder="Ej: Pablo">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono de Contacto</label>
                    <input type="tel" id="telefono" required placeholder="+54 9 11...">
                </div>
                <div class="form-group">
                    <label for="fecha_ingreso">Fecha de Matriculación</label>
                    <input type="date" id="fecha_ingreso" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAG1apqQS-dkCCTob3lmv0BGjph3vb-EkE",
            authDomain: "academia-del-espiritu.firebaseapp.com",
            projectId: "academia-del-espiritu",
            storageBucket: "academia-del-espiritu.firebasestorage.app",
            messagingSenderId: "1010285474661",
            appId: "1:1010285474661:web:2ff92a4091d631b54be78c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentsCollection = collection(db, "estudiantes");

        let studentsData = [];

        onSnapshot(studentsCollection, (snapshot) => {
            studentsData = [];
            snapshot.forEach((doc) => {
                studentsData.push({
                    id: doc.id,
                    ...doc.data()
                });
            });
            renderTable();
            updateStats();
        });

        function renderTable() {
            const tbody = document.getElementById('studentsTableBody');
            if (studentsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No hay registros en el libro</td></tr>';
                return;
            }

            tbody.innerHTML = studentsData.map(student => {
                const fecha = new Date(student.fecha_ingreso);
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

                return `
                    <tr>
                        <td style="font-weight: 600; color: var(--primary-teal);">${student.nombre}</td>
                        <td>${student.apellido}</td>
                        <td style="font-style: italic;">${student.email}</td>
                        <td>${student.telefono}</td>
                        <td style="font-family: var(--font-ui); font-size: 0.9rem;">${fechaStr}</td>
                        <td class="actions">
                            <button class="btn btn-sm btn-secondary edit-btn" data-id="${student.id}">Editar</button>
                            <button class="btn btn-sm btn-danger delete-btn" data-id="${student.id}">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            assignButtonEvents();
        }

        function updateStats() {
            document.getElementById('totalStudents').textContent = studentsData.length;
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const newThisMonth = studentsData.filter(s => {
                const date = new Date(s.fecha_ingreso);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;
            
            document.getElementById('newStudentsMonth').textContent = newThisMonth;
        }

        function assignButtonEvents() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('button');
                    const studentId = button.getAttribute('data-id');
                    openEditModal(studentId);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('button');
                    const studentId = button.getAttribute('data-id');
                    confirmDeleteStudent(studentId);
                });
            });
        }

        async function openEditModal(id) {
            const student = studentsData.find(s => s.id === id);
            if (!student) {
                alert('Registro no encontrado en el archivo');
                return;
            }

            document.getElementById('modalTitle').textContent = 'Editar Registro';
            document.getElementById('studentId').value = student.id;
            document.getElementById('nombre').value = student.nombre;
            document.getElementById('apellido').value = student.apellido;
            document.getElementById('email').value = student.email;
            document.getElementById('telefono').value = student.telefono;
            
            const fecha = new Date(student.fecha_ingreso);
            const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
            const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
            document.getElementById('fecha_ingreso').value = adjustedDate.toISOString().split('T')[0];

            document.getElementById('studentModal').classList.add('active');
        }

        async function confirmDeleteStudent(id) {
            if (confirm('¿Está seguro de desechar este registro? Esta acción es permanente.')) {
                try {
                    await deleteDoc(doc(db, "estudiantes", id));
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert('Error administrativo al eliminar el registro');
                }
            }
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('studentId').value;
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const fechaInput = document.getElementById('fecha_ingreso').value;

            const [year, month, day] = fechaInput.split('-').map(Number);
            const fechaTimestamp = new Date(year, month - 1, day).getTime();

            const studentData = {
                nombre,
                apellido,
                email,
                telefono,
                fecha_ingreso: fechaTimestamp
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "estudiantes", id), studentData);
                } else {
                    await addDoc(studentsCollection, studentData);
                }
                closeModal();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert('Error al guardar los datos en el archivo');
            }
        });

        window.openModal = () => {
            document.getElementById('modalTitle').textContent = 'Nuevo Registro';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('studentModal').classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('studentModal').classList.remove('active');
        };

        window.exportToCSV = () => {
            if (studentsData.length === 0) {
                alert('El archivo está vacío');
                return;
            }

            let csvContent = "text/csv;charset=utf-8,";
            csvContent += "ID,Nombre,Apellido,Email,Teléfono,Fecha Ingreso\n";

            studentsData.forEach(student => {
                const fecha = new Date(student.fecha_ingreso);
                const userTimezoneOffset = fecha.getTimezoneOffset() * 60000;
                const adjustedDate = new Date(fecha.getTime() + userTimezoneOffset);
                const fechaStr = adjustedDate.toLocaleDateString('es-ES');

                const row = [
                    student.id,
                    `"${student.nombre}"`,
                    `"${student.apellido}"`,
                    `"${student.email}"`,
                    `"${student.telefono}"`,
                    fechaStr
                ].join(",");
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `registro_academia_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        document.getElementById('studentModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('studentModal')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
