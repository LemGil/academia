# Compila la APK de Academia del Espíritu (estudiante) en GitHub.
# Uso: pestaña Actions → "Construir APK Academia del Espíritu" → Run workflow.
# Al terminar, la APK queda en "Artifacts" de la corrida para descargar
# desde la PC o desde el móvil e instalarla / pasarla por Bluetooth/archivo.
#
# FIRMA FIJA (desde v1.3.3): la APK se firma siempre con la misma clave
# (secreto ANDROID_KEYSTORE del repositorio), así cada versión nueva se
# instala ENCIMA de la anterior sin desinstalar — y sin perder el
# progreso guardado en el teléfono. Sin firma fija, cada corrida de
# GitHub firma con una clave temporal distinta y Android obliga a
# desinstalar. Secretos necesarios: ANDROID_KEYSTORE (keystore en
# base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Ver LEEME.md, sección «Firma fija».
name: Construir APK Academia del Espíritu

on:
  workflow_dispatch:
  push:
    tags:
      - 'academia-v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 exige Node >= 22
          node-version: '22'

      - name: Preparar Java (para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # @capacitor/android 8.5.x exige compilar con Java 21
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Empaquetar enseñanzas
        run: npm run contenido

      - name: Compilar la web (Capacitor)
        env:
          BUILD_TARGET: capacitor
        run: npm run build:capacitor

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar la APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Preparar la clave de firma fija
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE en el repositorio"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/academia.keystore"

      - name: Firmar la APK con la clave fija
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/academia.keystore" \
            --ks-pass "env:STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASS" \
            --out android/app/build/outputs/apk/debug/app-firmada.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir la APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          # El número de corrida distingue cada descarga (antes todas se
          # llamaban igual y era fácil instalar una APK vieja sin notarlo).
          # Dentro va SOLO app-firmada.apk (la de la firma fija).
          name: Academia-Espiritu-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-firmada.apk
          if-no-files-found: error
